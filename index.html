<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy: only local scripts and styles may load; no
       remote content, no plugins, no frames. Notes are HTML files, so this
       is the backstop if anything ever slips past the editor's sanitizer.
       ('unsafe-inline' applies to styles only: Quill and saved note content
       legitimately carry inline style attributes; scripts stay 'self'.) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>NeatNote</title>
  <!-- Vendored Quill 2 (rich text editor) — loaded locally, no CDN/build step -->
  <link rel="stylesheet" href="vendor/quill/quill.core.css">
  <link rel="stylesheet" href="src/styles/main.css">
  <!-- Applies the saved theme colors before the first paint (no flash of
       the default palette). Must stay a plain blocking script in <head>. -->
  <script src="src/renderer/theme-boot.js"></script>
</head>
<body>
  <!-- Custom titlebar (frameless window). Drag region + window controls are
       wired up by titlebar.js; controls adapt to macOS / Windows. -->
  <header id="titlebar" class="titlebar">
    <div class="titlebar-drag"></div>
    <div class="titlebar-app">
      <span class="titlebar-mark" aria-hidden="true"></span>
      <span class="titlebar-name">NeatNote</span>
    </div>
    <div class="titlebar-actions">
      <div id="settings-icon" class="settings-icon" title="Settings" role="button" aria-label="Settings" tabindex="0">
        <!-- SVG inserted by JavaScript -->
      </div>
    </div>
    <div id="titlebar-controls" class="titlebar-controls">
      <!-- Window controls inserted by titlebar.js -->
    </div>
  </header>

  <div class="app-container">
    <nav class="sidebar" aria-label="Notes">
      <div class="sidebar-header">
        <button id="new-folder-btn" type="button">
          <span class="btn-icon" aria-hidden="true">+</span> New Folder
        </button>
        <button id="new-file-btn" type="button">
          <span class="btn-icon" aria-hidden="true">+</span> New File
        </button>
      </div>
      <div class="search-container">
        <svg class="search-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search notes" aria-label="Search note names and contents" autocomplete="off" spellcheck="false">
      </div>
      <!-- role="tree" and the rows are set up by folderTree.js -->
      <div id="folder-tree" class="folder-tree"></div>
      <div id="trash-container" class="trash-container" role="button" tabindex="0"
           aria-label="Move the open note to the trash"
           title="Drag a note or folder here — or click to trash the open note">
        <div class="trash-icon" aria-hidden="true"></div>
        <div class="trash-label">Drag here to move to trash</div>
      </div>
    </nav>
    <main class="editor-container">
      <div class="editor-header">
        <span id="current-file-path" class="note-title"></span>
        <button id="export-btn" class="header-btn" type="button">Export</button>
        <button id="save-btn" class="header-btn" type="button">Save</button>
      </div>
      <div id="editor-toolbar" class="editor-toolbar" role="toolbar" aria-label="Text formatting">
        <!-- Toolbar buttons are generated by JavaScript (editor.js) so
             tooltips can show platform-specific shortcuts (Ctrl vs Cmd) -->
      </div>
      <div id="editor"></div>
      <div class="editor-footer">
        <span id="word-count"></span>
      </div>
    </main>
  </div>

  <!-- Custom Modal Dialog for creating folder/file -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">Enter name</h3>
      </div>
      <div class="modal-body">
        <input type="text" id="modal-input" placeholder="Name" aria-labelledby="modal-title" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-footer">
        <button id="modal-cancel-btn" type="button">Cancel</button>
        <button id="modal-confirm-btn" type="button">Create</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal Dialog -->
  <div id="settings-overlay" class="modal-overlay">
    <div class="modal-container settings-container" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h3 id="settings-title">Settings</h3>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h4 id="theme-heading">Theme</h4>
          <div class="theme-options" role="radiogroup" aria-labelledby="theme-heading">
            <div class="theme-option theme-light" data-theme="light" aria-label="Light theme">
              <div class="theme-preview">
                <div class="theme-preview-sidebar"></div>
                <div class="theme-preview-content">
                  <span class="theme-preview-line"></span>
                  <span class="theme-preview-dot"></span>
                </div>
              </div>
              <div class="theme-label">Light</div>
            </div>
            <div class="theme-option theme-dark" data-theme="dark" aria-label="Dark theme">
              <div class="theme-preview">
                <div class="theme-preview-sidebar"></div>
                <div class="theme-preview-content">
                  <span class="theme-preview-line"></span>
                  <span class="theme-preview-dot"></span>
                </div>
              </div>
              <div class="theme-label">Dark</div>
            </div>
            <div class="theme-option theme-paper" data-theme="paper" aria-label="Paper theme">
              <div class="theme-preview">
                <div class="theme-preview-sidebar"></div>
                <div class="theme-preview-content">
                  <span class="theme-preview-line"></span>
                  <span class="theme-preview-dot"></span>
                </div>
              </div>
              <div class="theme-label">Paper</div>
            </div>
            <div class="theme-option theme-moss" data-theme="moss" aria-label="Moss theme">
              <div class="theme-preview">
                <div class="theme-preview-sidebar"></div>
                <div class="theme-preview-content">
                  <span class="theme-preview-line"></span>
                  <span class="theme-preview-dot"></span>
                </div>
              </div>
              <div class="theme-label">Moss</div>
            </div>
            <div class="theme-option theme-dusk" data-theme="dusk" aria-label="Dusk theme">
              <div class="theme-preview">
                <div class="theme-preview-sidebar"></div>
                <div class="theme-preview-content">
                  <span class="theme-preview-line"></span>
                  <span class="theme-preview-dot"></span>
                </div>
              </div>
              <div class="theme-label">Dusk</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="settings-close-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- Quill must load before the app so window.Quill exists at init time -->
  <script src="vendor/quill/quill.js"></script>
  <script type="module" src="src/renderer/index.js"></script>
</body>
</html>
