<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7bf5"/>
      <stop offset="1" stop-color="#3550d6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Tile on the macOS icon grid: 824px body, 100px margin -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Note page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M330 250 H600 L720 370 V734 a40 40 0 0 1 -40 40 H330 a40 40 0 0 1 -40 -40 V290 a40 40 0 0 1 40 -40 Z" fill="url(#page)"/>
  </g>
  <path d="M600 250 V330 a40 40 0 0 0 40 40 H720 Z" fill="#c9d3f6"/>

  <!-- Text lines -->
  <rect x="360" y="420" width="220" height="30" rx="15" fill="#3550d6"/>
  <rect x="360" y="500" width="290" height="24" rx="12" fill="#b8c3ea"/>
  <rect x="360" y="568" width="290" height="24" rx="12" fill="#b8c3ea"/>
  <rect x="360" y="636" width="190" height="24" rx="12" fill="#b8c3ea"/>
</svg>
